<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSON | Illustrations</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* =========================================
           Global Variables & Reset
           ========================================= */
        :root {
            --neon-cyan: #00e6fe;
            --dark-bg: #06101e;
            --glass-bg: rgba(4, 21, 45, 0.6);
            --glass-border: rgba(0, 230, 254, 0.2);
            --text-main: #e0f7fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Cyberpunk grid background */
        body {
            background-color: var(--dark-bg);
            background-image: 
                linear-gradient(rgba(0, 230, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 230, 254, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; /* Creates the grid pattern */
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================================
           Header & Navigation (Upgraded to Premium)
           ========================================= */
        header {
            position: sticky;
            top: 20px; /* Floating look */
            z-index: 1000;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 40px;
            max-width: 1100px;
            width: calc(100% - 40px);
            margin: 0 auto;
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 230, 254, 0.1);
        }

        .navbar {
            display: flex;
            gap: 10px;
            align-items: center;
            height: 100%;
        }

        /* Basic style for nav links */
        .navbar a, .dropbtn {
            position: relative;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            padding: 10px 18px;
            border-radius: 20px;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        /* Clean hover: background glow only */
        .navbar a:hover, .dropdown:hover .dropbtn {
            color: #fff;
            background: rgba(0, 230, 254, 0.15);
            box-shadow: 0 0 15px rgba(0, 230, 254, 0.3);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* Dropdown styling */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 15px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 16, 30, 0.85); /* Deep dark glass */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-top: 3px solid var(--neon-cyan); /* High-tech accent line */
            border-radius: 12px;
            min-width: 180px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 230, 254, 0.15);
            padding: 10px 0;
            z-index: 1001;
        }

        .dropdown-content a {
            text-align: left;
            color: #b0d4e3; /* Softer blue for text */
            padding: 12px 20px;
            display: block;
            margin: 4px 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        /* Interactive hover in dropdown */
        .dropdown-content a:hover {
            color: var(--neon-cyan);
            background: rgba(0, 230, 254, 0.08);
            text-shadow: 0 0 8px rgba(0, 230, 254, 0.6);
            transform: translateX(4px); /* Cute slide effect */
        }

        /* Active page styling (in dropdown) */
        .dropdown-content a.active-link {
            color: var(--neon-cyan);
            font-weight: 700;
            background: transparent;
            border: none;
            padding-left: 30px; /* Space for the active marker */
        }

        /* Active marker Details */
        .dropdown-content a.active-link::before {
            content: '•';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
            font-size: 20px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Slick menu animation */
        .dropdown:hover .dropdown-content,
        .dropdown:focus-within .dropdown-content {
            display: block;
            animation: dropFade 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes dropFade {
            0% { opacity: 0; transform: translate(-50%, 15px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }

        /* =========================================
           Main Content & Gallery Layout
           ========================================= */
        main {
            flex: 1;
            padding: 80px 20px 40px; /* More padding for floating header */
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .page-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 230, 254, 0.5);
            margin-bottom: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .section-subtitle {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 25px;
            border-left: 4px solid var(--neon-cyan);
            padding-left: 15px;
            letter-spacing: 1px;
        }

        /* --- Smart Grid: Sizes match AND it's left-aligned --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        /* Use this class for categories with only 1 or 2 items to center them */
        .centered-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }
        .centered-grid .glass-card {
            width: 100%;
            max-width: 350px;
        }

        /* Glassmorphism Card Design */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 15px;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .glass-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 230, 254, 0.2);
            border-color: rgba(0, 230, 254, 0.8);
        }

        /* Image container within the card */
        .img-container {
            width: 100%;
            aspect-ratio: 1 / 1; 
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transition: transform 0.5s ease;
        }

        .glass-card:hover .img-container img {
            transform: scale(1.08);
        }

        /* --- Special backgrounds for Pixel Arts --- */
        .pixel-card {
            background: radial-gradient(circle, rgba(0, 230, 254, 0.1) 0%, rgba(4, 21, 45, 0.8) 80%);
        }

        .pixel-card .img-container img {
            object-fit: contain; 
            image-rendering: pixelated; 
        }

        /* Exception for Pixel Art Poster to fill the space */
        .poster-card .img-container img {
            object-fit: cover;
        }

        /* Artwork Title */
        .artwork-title {
            margin-top: 15px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* =========================================
           Modal / High-tech Neon Popup Gallery
           ========================================= */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(4, 21, 45, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--glass-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 230, 254, 0.5);
            border-radius: 20px;
            padding: 10px;
            max-width: 90%;
            max-height: 90%;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: popup 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @keyframes popup {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 12px;
        }

        #caption {
            margin-top: 15px;
            padding: 0 20px 10px;
            text-align: center;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Modal Close Button */
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--neon-cyan);
            font-size: 2rem;
            cursor: pointer;
            transition: 0.3s;
            text-shadow: 0 0 10px var(--neon-cyan);
            z-index: 2001;
        }

        .modal-close:hover {
            color: #fff;
            transform: scale(1.1) rotate(90deg);
        }

        /* Modal Controls (Prev/Next) */
        .modal-prev,
        .modal-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 3rem;
            background: transparent;
            border: none;
            cursor: pointer;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            z-index: 2001;
            padding: 20px;
        }
        
        .modal-prev:hover,
        .modal-next:hover {
            color: var(--neon-cyan);
            transform: translateY(-50%) scale(1.1);
            text-shadow: 0 0 15px var(--neon-cyan);
        }

        .modal-prev { left: 30px; }
        .modal-next { right: 30px; }

        /* Footer */
        .site-footer {
            text-align: center;
            padding: 25px;
            background: rgba(0, 230, 254, 0.1);
            border-top: 1px solid var(--glass-border);
            color: var(--neon-cyan);
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <div class="dropdown">
                <button class="dropbtn">Portfolio <i class="bi bi-chevron-down" style="font-size: 12px; margin-left: 5px;"></i></button>
                <div class="dropdown-content">
                    <a href="illustration.html" class="active-link">Illustrations</a>
                    <a href="3d-modeling.html">3D Modeling</a>
                    <a href="photo.html">Photos</a>
                    <a href="video.html">Videos</a>
                    <a href="ui-ux.html">UI/UX</a>
                </div>
            </div>
            <a href="socialmedia.html">Social Media</a>
            <a href="contact.html">Contact Me</a>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Illustrations</h1>

        <h2 class="section-subtitle">Image Manipulation</h2>
        <div id="manipulation-gallery" class="gallery-grid centered-grid">
            </div>

        <h2 class="section-subtitle">Pixel Arts</h2>
        <div id="pixel-gallery" class="gallery-grid">
            </div>
    </main>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close"><i class="bi bi-x-lg"></i></span>
        <button class="modal-prev" onclick="changeImage(-1); event.stopPropagation();"><i class="bi bi-chevron-left"></i></button>
        <button class="modal-next" onclick="changeImage(1); event.stopPropagation();"><i class="bi bi-chevron-right"></i></button>
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modalImg" class="modal-image" />
            <div id="caption"></div>
        </div>
    }

    <footer class="site-footer">
        <p>© 2026 DSON. All rights reserved.</p>
    </footer>

    <script>
        // --- 1. Your Artwork Data (Keep this clean!) ---
        // Normally linked from 'portfolio-data.js'
        const myArtworks = {
            manipulation: [
                { image: "https://placehold.co/600x450/06101e/00e6fe?text=Apocalypse", title: "Apocalypse", langKey: "img-apocalypse" },
                { image: "https://placehold.co/600x450/06101e/00e6fe?text=Substance+Abuse", title: "Substance Abuse", langKey: "img-substance" }
            ],
            pixelArts: [
                { image: "https://placehold.co/400x400/transparent/00e6fe?text=Pixel+Boy", title: "Character Design (Boy)", langKey: "pixel-boy" },
                { image: "https://placehold.co/400x400/transparent/00e6fe?text=Pixel+Girl", title: "Character Design (Girl)", langKey: "pixel-girl" },
                { image: "https://placehold.co/400x400/transparent/00e6fe?text=Soldier", title: "Soldier", langKey: "pixel-soldier" },
                { image: "https://placehold.co/600x900/06101e/00e6fe?text=Poster", title: "Pixel Art Poster", langKey: "pixel-poster" }
            ]
        };

        // Initialize state for the gallery modal
        let currentCategory = '';
        let currentImageIndex = 0;

        // --- 2. Generate the Galleries on Load ---
        document.addEventListener('DOMContentLoaded', () => {
            
            // Generate Manipulation Cards
            const manipulationContainer = document.getElementById('manipulation-gallery');
            if (manipulationContainer) {
                let htmlContent = '';
                myArtworks.manipulation.forEach((art, index) => {
                    htmlContent += `
                    <div class="glass-card" onclick="openModal('manipulation', ${index})">
                        <div class="img-container">
                            <img src="${art.image}" alt="${art.title}" data-lang="${art.langKey}" loading="lazy"
                                onerror="this.src='https://placehold.co/600x600/06101e/00e6fe?text=Image+Missing'">
                        </div>
                        <div class="artwork-title">${art.title}</div>
                    </div>`;
                });
                manipulationContainer.innerHTML = htmlContent;
            }

            // Generate Pixel Art Cards
            const pixelContainer = document.getElementById('pixel-gallery');
            if (pixelContainer) {
                let htmlContent = '';
                myArtworks.pixelArts.forEach((art, index) => {
                    // Check if it's the Poster to give it the 'poster-card' exception
                    const isPoster = art.title === "Pixel Art Poster";
                    htmlContent += `
                    <div class="glass-card pixel-card ${isPoster ? 'poster-card' : ''}" onclick="openModal('pixelArts', ${index})">
                        <div class="img-container">
                            <img src="${art.image}" alt="${art.title}" data-lang="${art.langKey}" loading="lazy"
                                onerror="this.src='https://placehold.co/600x600/06101e/00e6fe?text=Pixel+Art+Missing'">
                        </div>
                        <div class="artwork-title">${art.title}</div>
                    </div>`;
                });
                pixelContainer.innerHTML = htmlContent;
            }
        });

        // --- 3. Modal Gallery Logic ---
        function openModal(category, index) {
            currentCategory = category;
            currentImageIndex = index;
            const artwork = myArtworks[category][index];
            
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const captionText = document.getElementById('caption');
            
            // Enable controls if there's more than one image in the category
            const hasMultipleImages = myArtworks[category].length > 1;
            document.querySelector('.modal-prev').style.display = hasMultipleImages ? "block" : "none";
            document.querySelector('.modal-next').style.display = hasMultipleImages ? "block" : "none";
            
            modal.style.display = "flex";
            setTimeout(() => { modal.classList.add('active'); }, 10);
            
            modalImg.src = artwork.image;
            captionText.innerHTML = artwork.title;
            document.body.style.overflow = "hidden"; // Prevent background scrolling
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = "none";
                document.body.style.overflow = "auto";
            }, 500);
        }

        function changeImage(direction) {
            const categoryImages = myArtworks[currentCategory];
            currentImageIndex += direction;
            
            // Loop back around
            if (currentImageIndex < 0) {
                currentImageIndex = categoryImages.length - 1;
            } else if (currentImageIndex >= categoryImages.length) {
                currentImageIndex = 0;
            }
            
            const artwork = categoryImages[currentImageIndex];
            const modalImg = document.getElementById('modalImg');
            const captionText = document.getElementById('caption');
            
            // Simple fade cross-fade for the image
            modalImg.style.opacity = 0;
            setTimeout(() => {
                modalImg.src = artwork.image;
                captionText.innerHTML = artwork.title;
                modalImg.style.opacity = 1;
            }, 150);
        }
    </script>
</body>
</html>
