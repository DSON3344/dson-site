<script>
  /**
   * Animation controller synced with dynamic content loading
   */
  function applyPortfolioAnimations() {
    const cards = document.querySelectorAll('.portfolio-item');
    
    if (cards.length > 0) {
      cards.forEach((card, index) => {
        // Only assign custom viewport animations if not already defined
        if (!card.hasAttribute('data-aos')) {
          const animationType = (index % 2 === 0) ? 'fade-right' : 'fade-left';
          card.setAttribute('data-aos', animationType);
          card.setAttribute('data-aos-delay', '50'); 
        }
      });

      // Initialize AOS with immediate response configurations
      AOS.init({
        duration: 1000,
        easing: 'ease-out-cubic',
        once: true,
        offset: 0 
      });
      
      AOS.refreshHard(); 
      console.log("Animations applied to " + cards.length + " items!");
    } else {
      // Retry injection if dynamic data elements are not fully parsed yet
      setTimeout(applyPortfolioAnimations, 50);
    }
  }

  // Bind animation logic on system loading windows
  window.addEventListener('load', applyPortfolioAnimations);

  // Fallback pooling system to double-check asynchronous CMS loading streams
  let checkCount = 0;
  const ensureAOS = setInterval(() => {
    const cards = document.querySelectorAll('.portfolio-item');
    if (cards.length > 0 || checkCount > 10) {
      applyPortfolioAnimations();
      clearInterval(ensureAOS);
    }
    checkCount++;
  }, 500);

  // SEO: 提升页面加载速度，已移除废弃的 Netlify 脚本
</script>
