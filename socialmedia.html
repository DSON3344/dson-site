       descZh:"行业人脉拓展、分享科技见解以及日常的社区交流互动。",
       url:"https://twitter.com/DSON_04",
       grad:"linear-gradient(155deg,#2E2E2E 0%,#050505 70%)", accent:"#FFFFFF", darkGlow:true,
       svg:"M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z",
       wave:[30,45,36,55,28,42,34,50,38,32],
       stats:[
         {labelEn:"FOLLOWERS", labelZh:"粉丝", value:"102"},
         {labelEn:"TOTAL VIEWS", labelZh:"总浏览量", value:"93,468"}
       ], asOf:"19/05/2025"}
    ];

    var n = platforms.length;

    function statBlockHTML(p){
      if (!p.stats || !p.stats.length){
        return '<div class="back-stat back-stat-empty"><div class="back-stat-note">' +
          spanPair(
            "Live stats coming soon — API not yet connected",
            "实时数据统计筹备中，尚未接入 API"
          ) + '</div></div>';
      }
      var rows = p.stats.map(function(s){
        return '<div class="back-stat-row"><span class="back-stat-label">' +
          spanPair(s.labelEn, s.labelZh) +
          '</span><span class="back-stat-num">' + s.value + '</span></div>';
      }).join("");
      var note = p.live
        ? spanPair("● Live · fetched just now", "● 实时数据 · 刚刚获取")
        : spanPair(
            "As of " + p.asOf + " · updated by hand, live API pending",
            "数据截至 " + p.asOf + " · 人工更新，尚未接入实时 API"
          );
      return '<div class="back-stat">' + rows + '<div class="back-stat-note">' + note + '</div></div>';
    }

    function buildFront(p, idx){
      var front = document.createElement("div");
      front.className = "face front";
      front.style.background = p.grad;
      var logoHTML = p.svg
        ? '<div class="logo3d svg"><svg viewBox="'+(p.viewBox||"0 0 24 24")+'" aria-hidden="true"><path d="'+p.svg+'"/></svg></div>'
        : '<div class="logo3d text">'+p.name+'</div>';
      var nm = platName(p);
      front.innerHTML =
        '<div class="glow"></div>' +
        '<div class="holo"></div>' +
        '<div class="tech-pattern"></div>' +
        '<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>' +
        '<span class="settag">SOCIAL · 0'+(idx+1)+'</span>' +
        logoHTML +
        '<div class="databar">'+p.wave.slice(0,14).map(function(v){return '<i style="height:'+Math.max(20,v)+'%"></i>';}).join("")+'</div>' +
        '<div><div class="fname">'+spanPair(nm.en, nm.zh)+'</div><div class="fhint">'+spanPair("↻ Tap to flip","↻ 点击翻面")+'</div></div>';
      return front;
    }

    function buildBack(p, idx){
      var back = document.createElement("div");
      back.className = "face back";
      back.style.setProperty("--bk-accent", p.accent);
      var bars = p.wave.map(function(v){return '<i style="height:'+v+'%"></i>';}).join("");
      var nm = platName(p);
      back.innerHTML =
        '<div class="backpattern"></div>' +
        '<span class="corner tl"></span><span class="corner br"></span>' +
        '<div class="back-head"><b>'+spanPair(nm.en, nm.zh)+'</b><span>'+p.handle+'</span></div>' +
        '<p class="back-desc">'+spanPair(p.descEn, p.descZh)+'</p>' +
        statBlockHTML(p) +
        '<div class="back-wave"><span class="back-wave-label">'+spanPair("Signal preview (demo)","信号预览（示意）")+'</span><div class="back-wave-bars">'+bars+'</div></div>' +
        '<a class="back-link" tabindex="-1" href="'+p.url+'" target="_blank" rel="noopener">'+spanPair("Visit platform →","前往平台 →")+'</a>' +
        '<div class="back-foot"><span>DSON · SOCIAL</span><span>0'+(idx+1)+' / 0'+n+'</span></div>';
      return back;
    }

    function cardLabel(p, lang){
      var nm = platName(p)[lang === "zh" ? "zh" : "en"];
      return lang === "zh" ? (nm + " 卡片，点击翻面查看详情") : (nm + " card — press to flip and see details");
    }

    var gyroActive = false;

    function buildCard(p, idx){
      var persp = document.createElement("div");
      persp.className = "card-persp";
      persp.setAttribute("data-reveal", "");
      persp.style.setProperty("--d", (idx % 4) * 90 + Math.floor(idx / 4) * 140 + "ms");
      var idle = document.createElement("div");
      idle.className = "card-idle";
      var tilt = document.createElement("div");
      tilt.className = "card-tilt";
      var glare = document.createElement("div");
      glare.className = "glare";
      var inner = document.createElement("div");
      inner.className = "card-inner";
      var aura = document.createElement("div");
      aura.className = "aura";
      aura.style.background = p.darkGlow ? "#fff" : p.grad;
      inner.appendChild(aura);
      ["edge-t","edge-r","edge-b","edge-l"].forEach(function(cls){
        var edge = document.createElement("div");
        edge.className = "edge " + cls;
        inner.appendChild(edge);
      });
      inner.appendChild(buildFront(p, idx));
      inner.appendChild(buildBack(p, idx));
      tilt.appendChild(glare);
      tilt.appendChild(inner);
      idle.appendChild(tilt);
      persp.appendChild(idle);

      tilt.tabIndex = 0;
      tilt.setAttribute("role","button");
      tilt.setAttribute("aria-pressed","false");
      tilt.dataset.pidx = String(idx);
      tilt.setAttribute("aria-label", cardLabel(p, currentLang()));
      setupTilt(tilt, glare);
      return persp;
    }

    function setupTilt(tilt, glare){
      var down = null;
      var maxDeg = 11;
      var link = tilt.querySelector(".back-link");
      if (link){
        link.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
        link.addEventListener("pointerup", function(e){ e.stopPropagation(); });
      }
      function applyTilt(clientX, clientY){
        if (reduceMotion) return;
        var r = tilt.getBoundingClientRect();
        var px = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
        var py = Math.min(1, Math.max(0, (clientY - r.top) / r.height));
        var rx = (py - 0.5) * -2 * maxDeg;
        var ry = (px - 0.5) * 2 * maxDeg;
        tilt.style.transform = "rotateX("+rx.toFixed(2)+"deg) rotateY("+ry.toFixed(2)+"deg)";
        glare.style.setProperty("--gx",(px*100).toFixed(1)+"%");
        glare.style.setProperty("--gy",(py*100).toFixed(1)+"%");
      }
      function reset(){ tilt.classList.remove("tilting"); tilt.style.transform=""; }
      function toggleFlip(){
        var willFlip = !tilt.classList.contains("flipped");
        if (willFlip){
          document.querySelectorAll(".card-tilt.flipped").forEach(function(o){
            if (o !== tilt) setFlipped(o, false);
          });
        }
        setFlipped(tilt, willFlip);
      }
      function gyroOwns(){ return gyroActive && tilt.dataset.gyro === "1"; }
      tilt.addEventListener("pointerenter", function(e){ if (gyroOwns()) return; tilt.classList.add("tilting"); applyTilt(e.clientX,e.clientY); });
      tilt.addEventListener("pointermove", function(e){ if (gyroOwns()) return; tilt.classList.add("tilting"); applyTilt(e.clientX,e.clientY); });
      tilt.addEventListener("pointerdown", function(e){
        down = {x:e.clientX,y:e.clientY,t:Date.now()};
        try{ tilt.setPointerCapture(e.pointerId); }catch(err){}
        if (gyroOwns()) return;
        tilt.classList.add("tilting"); applyTilt(e.clientX,e.clientY);
      });
      tilt.addEventListener("pointerup", function(e){
        try{ tilt.releasePointerCapture(e.pointerId); }catch(err){}
        if (down){
          var dx=e.clientX-down.x, dy=e.clientY-down.y, dt=Date.now()-down.t;
          if (Math.hypot(dx,dy)<10 && dt<500){ toggleFlip(); }
        }
        down = null;
        if (e.pointerType==="touch"){ reset(); }
      });
      tilt.addEventListener("pointercancel", function(){ down=null; reset(); });
      tilt.addEventListener("pointerleave", function(e){ if (e.pointerType!=="touch"){ reset(); } });
      tilt.addEventListener("keydown", function(e){
        if (e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleFlip(); }
      });
    }

    // Flipping also decides whether the (hidden-when-facing-away) link can take keyboard focus.
    function setFlipped(tilt, on){
      tilt.classList.toggle("flipped", on);
      tilt.setAttribute("aria-pressed", on ? "true" : "false");
      var link = tilt.querySelector(".back-link");
      if (link) link.tabIndex = on ? 0 : -1;
    }

    // ---- Motion (gyroscope/accelerometer) tilt — phones/tablets only ----
    // Whichever card sits closest to the middle of the screen follows the phone's tilt.
    var gyroBase = null, gyroRAF = null, gyroLast = null;

    function centerCard(){
      var best = null, bestD = Infinity, mid = window.innerHeight / 2, midX = window.innerWidth / 2;
      document.querySelectorAll(".card-tilt").forEach(function(t){
        var r = t.getBoundingClientRect();
        var d = Math.abs((r.top + r.height/2) - mid) + Math.abs((r.left + r.width/2) - midX);
        if (d < bestD){ bestD = d; best = t; }
      });
      return best;
    }
    function clearGyro(t){
      if (!t) return;
      t.dataset.gyro = "0"; t.classList.remove("tilting"); t.style.transform = "";
    }
    function onDeviceOrientation(e){
      if (e.beta == null || e.gamma == null) return;
      if (!gyroBase){ gyroBase = {beta:e.beta, gamma:e.gamma}; return; }
      if (gyroRAF) return;
      gyroRAF = requestAnimationFrame(function(){
        gyroRAF = null;
        if (!gyroActive) return;
        var t = centerCard();
        if (!t) return;
        if (gyroLast && gyroLast !== t) clearGyro(gyroLast);
        gyroLast = t; t.dataset.gyro = "1";
        var maxDeg = 11, range = 24;
        var db = Math.max(-range, Math.min(range, e.beta - gyroBase.beta));
        var dg = Math.max(-range, Math.min(range, e.gamma - gyroBase.gamma));
        var rx = (db/range) * -maxDeg, ry = (dg/range) * maxDeg;
        var px = Math.min(1, Math.max(0, 0.5 + (dg/range)*0.5));
        var py = Math.min(1, Math.max(0, 0.5 + (db/range)*0.5));
        t.classList.add("tilting");
        t.style.transform = "rotateX("+rx.toFixed(2)+"deg) rotateY("+ry.toFixed(2)+"deg)";
        var glare = t.querySelector(".glare");
        if (glare){ glare.style.setProperty("--gx",(px*100).toFixed(1)+"%"); glare.style.setProperty("--gy",(py*100).toFixed(1)+"%"); }
      });
    }
    function startGyro(){ gyroBase = null; gyroActive = true; window.addEventListener("deviceorientation", onDeviceOrientation); }
    function stopGyro(){
      gyroActive = false;
      window.removeEventListener("deviceorientation", onDeviceOrientation);
      document.querySelectorAll(".card-tilt").forEach(clearGyro);
    }

    function initGyroToggle(afterEl){
      var isCoarse = window.matchMedia && window.matchMedia("(hover:none) and (pointer:coarse)").matches;
      if (!isCoarse || reduceMotion) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "gyro-toggle";
      function label(on){
        btn.innerHTML = spanPair(
          on ? "✦ Motion tilt on — tap to turn off" : "✦ Tilt by moving your phone",
          on ? "✦ 重力感应已开启 — 点击关闭" : "✦ 移动手机来检视卡牌"
        );
      }
      label(false);
      btn.addEventListener("click", function(){
        if (gyroActive){ stopGyro(); btn.classList.remove("on"); label(false); }
        else {
          var DOE = window.DeviceOrientationEvent;
          if (DOE && typeof DOE.requestPermission === "function"){
            DOE.requestPermission().then(function(state){
              if (state === "granted"){ startGyro(); btn.classList.add("on"); label(true); }
              else { btn.innerHTML = spanPair("✦ Motion access denied — check Settings","✦ 未获得权限，请到系统设置里开启"); }
              if (typeof syncAllLanguage === "function") syncAllLanguage();
            }).catch(function(){
              btn.innerHTML = spanPair("✦ Motion tilt unavailable","✦ 当前环境不支持重力感应");
              if (typeof syncAllLanguage === "function") syncAllLanguage();
            });
          } else if (DOE){
            startGyro(); btn.classList.add("on"); label(true);
          } else {
            btn.disabled = true;
            btn.innerHTML = spanPair("✦ Motion tilt not supported here","✦ 此设备/浏览器不支持重力感应");
          }
        }
        if (typeof syncAllLanguage === "function") syncAllLanguage();
      });
      afterEl.insertAdjacentElement("afterend", btn);
      if (typeof syncAllLanguage === "function") syncAllLanguage();
    }

    var grid = document.getElementById("card-grid");
    platforms.forEach(function(p, i){ grid.appendChild(buildCard(p, i)); });
    initGyroToggle(grid);

    function relabelCards(lang){
      document.querySelectorAll(".card-tilt").forEach(function(tilt){
        var p = platforms[+tilt.dataset.pidx];
        if (p) tilt.setAttribute("aria-label", cardLabel(p, lang));
      });
    }
    document.querySelectorAll(".lang-switcher a").forEach(function(link){
      link.addEventListener("click", function(){
        relabelCards(link.textContent.indexOf("中文") !== -1 ? "zh" : "en");
      });
    });

    // ---- Live stats overlay ----
    // Runs once after the cards are already on screen with the manually-entered numbers
    // (so the first paint never waits on a network call). Whatever /api/social-stats
    // returns is written into `platforms[]` and patched into that card's back face.
    function patchStatDOM(p){
      var idx = platforms.indexOf(p);
      document.querySelectorAll(".card-tilt").forEach(function(tilt){
        if (+tilt.dataset.pidx !== idx) return;
        var oldStat = tilt.querySelector(".face.back .back-stat");
        if (oldStat) oldStat.outerHTML = statBlockHTML(p);
      });
    }

    function applyLiveStats(data){
      if (!data) return;
      var byName = {};
      platforms.forEach(function(p){ byName[p.name] = p; });

      if (data.github && byName.GitHub){
        var gh = byName.GitHub;
        gh.stats = [
          {labelEn:"FOLLOWERS", labelZh:"关注者", value: data.github.followers.toLocaleString()},
          {labelEn:"PUBLIC REPOS", labelZh:"公开仓库", value: String(data.github.publicRepos)}
        ];
        gh.live = true;
        patchStatDOM(gh);
      }
      if (data.youtube && byName.YouTube){
        var yt = byName.YouTube;
        yt.stats = [
          {labelEn:"SUBSCRIBERS", labelZh:"订阅者", value: data.youtube.subscribers.toLocaleString()},
          {labelEn:"TOTAL VIEWS", labelZh:"总浏览量", value: data.youtube.views.toLocaleString()}
        ];
        yt.live = true;
        patchStatDOM(yt);
      }
      if (typeof syncAllLanguage === "function") syncAllLanguage();
    }

    fetch("/api/social-stats")
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(applyLiveStats)
      .catch(function(){ /* stay on the manually-entered numbers */ });
  })();
  </script>
