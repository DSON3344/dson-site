  <!-- Social card carousel — page-scoped styles (only used on this page, so kept
       out of the shared DSON.css). Reuses the site's own tokens (--black, --white,
       --accent, --card-bg, --border, --text-muted) plus two font aliases so the
       component styling below can stay readable. -->
  <style>
    :root{
      --font-head:"Syne",sans-serif;
      --font-body:"Inter",-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    }

    .stage{background:var(--black);border:1px solid var(--border);border-radius:18px;padding:46px 16px 34px;width:min(880px,100% - 8vw);margin:0 auto 4rem;overflow:hidden;}

    /* ============ carousel shell ============ */
    .carousel-wrap{display:flex;align-items:center;justify-content:center;gap:14px;}
    .nav-btn{
      width:44px;height:44px;border-radius:50%;flex:0 0 auto;cursor:pointer;
      background:#16181B;border:1px solid #2A2D32;color:var(--white);
      display:flex;align-items:center;justify-content:center;font-size:17px;
      transition:border-color .15s ease,transform .15s ease,background .15s ease;
    }
    .nav-btn:hover{border-color:var(--accent);background:#1B1E22;}
    .nav-btn:active{transform:scale(.92);}
    .nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

    .carousel-row{position:relative;display:flex;align-items:center;justify-content:center;min-height:360px;}
    .slot{position:relative;}
    .slot-side{margin:0 -24px;z-index:1;cursor:pointer;}
    .slot-center{z-index:3;}
    .card-fly{position:absolute;top:0;z-index:0;pointer-events:none;}

    .counter{text-align:center;font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--text-muted);letter-spacing:.04em;margin-top:18px;}

    /* Motion-tilt toggle — phones/tablets only (no mouse). Lets the visitor swap
       press-and-hold tilting for the device's own gyroscope/accelerometer. */
    .gyro-toggle{
      display:none;margin:14px auto 0;padding:7px 16px;border-radius:999px;
      border:1px solid var(--border);background:#16181B;color:var(--text-muted);
      font-family:var(--font-body);font-weight:600;font-size:10.5px;letter-spacing:.03em;
      cursor:pointer;transition:border-color .15s ease,color .15s ease;
    }
    .gyro-toggle:active{transform:scale(.97);}
    .gyro-toggle.on{color:var(--accent);border-color:var(--accent);}
    @media (hover:none) and (pointer:coarse){
      .gyro-toggle{display:block;}
    }
    .counter b{color:var(--white);}

    /* ============ card ============ */
    .card-persp{width:220px;}
    .card-idle{position:relative;transition:transform .38s cubic-bezier(.22,1,.36,1),opacity .38s ease;perspective:1500px;will-change:transform,opacity;}
    .slot-prev .card-idle{transform:scale(.74) rotate(-7deg);opacity:.48;}
    .slot-next .card-idle{transform:scale(.74) rotate(7deg);opacity:.48;}
    .slot-center .card-idle{transform:scale(1) rotate(0deg);opacity:1;}

    .card-tilt{
      position:relative;z-index:1;width:100%;height:322px;border-radius:16px;
      transform-style:preserve-3d;transition:transform .55s cubic-bezier(.22,1,.36,1);
      transform:rotateX(-3deg) rotateY(6deg);
      touch-action:none;outline:none;
    }
    .slot-center .card-tilt{cursor:pointer;}
    .card-tilt.tilting{transition:none;}
    .card-tilt:focus-visible{box-shadow:0 0 0 3px var(--accent);border-radius:16px;}

    /* Hover / press / gyro-tilt aura — reuses each card's own front gradient (so
       a dark card gets a plain white glow and Instagram's glow is the same
       multi-colour blend as its face). Lives INSIDE .card-inner (alongside the
       front/back faces) rather than beside .card-tilt, so the 180deg flip
       rotation carries the glow along with it instead of leaving it standing
       still while the card turns. */
    .aura{
      position:absolute;z-index:0;inset:-8px;border-radius:20px;
      filter:blur(12px);opacity:0;pointer-events:none;
      transition:opacity .4s ease;
    }
    .card-tilt.tilting .aura{opacity:.6;}

    .glare{
      position:absolute;inset:0;border-radius:16px;pointer-events:none;z-index:6;
      background:radial-gradient(circle at var(--gx,50%) var(--gy,20%), rgba(255,255,255,.5), transparent 55%);
      opacity:0;transition:opacity .35s ease;
    }
    .card-tilt.tilting .glare{opacity:1;}

    .card-inner{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.2,.8,.2,1);}
    .card-tilt.flipped .card-inner{transform:rotateY(180deg);}

    /* ---- card body edges (gives the card physical thickness instead of a flat cutout) ---- */
    .edge{position:absolute;pointer-events:none;}
    .edge-r{left:100%;top:0;width:16px;height:100%;transform-origin:0% 50%;transform:rotateY(90deg);
      border-radius:16px 0 0 16px;
      background:linear-gradient(90deg,#484a52 0%,#202226 40%,#08090a 100%);}
    .edge-l{right:100%;top:0;width:16px;height:100%;transform-origin:100% 50%;transform:rotateY(-90deg);
      border-radius:0 16px 16px 0;
      background:linear-gradient(90deg,#08090a 0%,#202226 60%,#6a6d78 100%);}
    .edge-t{left:0;bottom:100%;width:100%;height:16px;transform-origin:50% 100%;transform:rotateX(90deg);
      border-radius:0 0 16px 16px;
      background:linear-gradient(180deg,#08090a 0%,#202226 60%,#6a6d78 100%);}
    .edge-b{left:0;top:100%;width:100%;height:16px;transform-origin:50% 0%;transform:rotateX(-90deg);
      border-radius:16px 16px 0 0;
      background:linear-gradient(180deg,#484a52 0%,#202226 40%,#08090a 100%);}

    .face{
      position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;backface-visibility:hidden;
      overflow:hidden;clip-path:inset(0 round 16px);-webkit-mask-image:-webkit-radial-gradient(white,black);
      display:flex;flex-direction:column;
      box-shadow:0 20px 36px -16px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.07) inset;
    }
    .face.back{transform:rotateY(180deg) translateZ(16px);background:var(--card-bg);border:1px solid var(--border);padding:14px 15px 12px;}

    /* ---- front decoration ---- */
    .face.front{color:#fff;padding:15px;justify-content:center;align-items:center;gap:14px;text-align:center;position:relative;}
    .front .glow{position:absolute;left:50%;top:40%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%);
      background:radial-gradient(circle, rgba(255,255,255,.30), transparent 68%);filter:blur(1px);pointer-events:none;}
    .front .tech-pattern{
      position:absolute;inset:0;pointer-events:none;opacity:.5;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.20) 1px, transparent 1.6px),
        repeating-linear-gradient(135deg, rgba(255,255,255,.10) 0 1px, transparent 1px 13px),
        repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4px);
      background-size:16px 16px, auto, auto;
    }
    .front .holo{
      position:absolute;inset:-25% -30%;pointer-events:none;opacity:.22;transform:rotate(9deg);
      background:linear-gradient(115deg, transparent 28%, rgba(255,60,180,.4) 40%, rgba(255,235,80,.35) 47%, rgba(60,220,255,.4) 54%, transparent 68%);
    }
    .corner{position:absolute;width:22px;height:22px;border:1.5px solid rgba(255,255,255,.6);pointer-events:none;z-index:3;}
    .corner.tl{top:4px;left:4px;border-right:none;border-bottom:none;border-radius:12px 0 0 0;}
    .corner.tr{top:4px;right:4px;border-left:none;border-bottom:none;border-radius:0 12px 0 0;}
    .corner.bl{bottom:4px;left:4px;border-right:none;border-top:none;border-radius:0 0 0 12px;}
    .corner.br{bottom:4px;right:4px;border-left:none;border-top:none;border-radius:0 0 12px 0;}
    .front .databar{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:9px;width:64%;opacity:.55;position:relative;z-index:2;}
    .front .databar i{flex:1;background:rgba(255,255,255,.75);display:block;border-radius:.5px;}
    .front .settag{font-family:var(--font-body);font-weight:600;font-size:8.5px;letter-spacing:.06em;background:rgba(0,0,0,.3);padding:2px 7px;border-radius:999px;position:relative;z-index:3;}
    .front .logo3d{position:relative;z-index:3;}
    .front .logo3d.text{
      font-family:var(--font-head);font-weight:800;font-size:40px;letter-spacing:0;
      text-align:center;color:#fff;
      text-shadow:0 1px 0 rgba(255,255,255,.55),0 2px 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.18),0 4px 0 rgba(0,0,0,.18),0 7px 10px rgba(0,0,0,.5);
    }
    .front .logo3d.svg svg{
      display:block;width:58px;height:58px;fill:#fff;
      filter:drop-shadow(0 1px 0 rgba(255,255,255,.55)) drop-shadow(0 2px 0 rgba(0,0,0,.18)) drop-shadow(0 3px 0 rgba(0,0,0,.18)) drop-shadow(0 4px 0 rgba(0,0,0,.18)) drop-shadow(0 7px 10px rgba(0,0,0,.5));
    }
    .front .fname{font-family:var(--font-head);font-weight:700;font-size:14px;text-align:center;position:relative;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.5);}
    .front .fhint{font-family:var(--font-body);font-weight:500;font-size:8px;letter-spacing:.03em;text-align:center;color:rgba(255,255,255,.8);position:relative;z-index:3;}

    /* ---- back decoration ---- */
    .face.back .backpattern{position:absolute;inset:0;pointer-events:none;opacity:.5;
      background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.5px);background-size:13px 13px;}
    .back .corner{border-color:rgba(255,255,255,.12);}
    .back-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:7px;position:relative;z-index:2;}
    .back-head b{font-family:var(--font-head);font-weight:700;font-size:14px;color:var(--bk-accent,var(--accent));}
    .back-head span{font-family:var(--font-body);font-weight:500;font-size:9px;color:var(--text-muted);}
    .back-desc{font-family:var(--font-body);font-size:10px;line-height:1.5;color:#B7BAC0;margin:0 0 9px;position:relative;z-index:2;}
    .back-stat{border:1px dashed #33373C;border-radius:8px;padding:7px 9px;margin-bottom:9px;position:relative;z-index:2;}
    .back-stat-row{display:flex;justify-content:space-between;align-items:baseline;}
    .back-stat-row + .back-stat-row{margin-top:5px;padding-top:5px;border-top:1px dashed #262A2F;}
    .back-stat-label{font-family:var(--font-body);font-weight:600;font-size:8px;letter-spacing:.05em;color:var(--text-muted);text-transform:uppercase;}
    .back-stat-num{font-family:var(--font-body);font-size:17px;font-weight:700;color:var(--white);font-variant-numeric:tabular-nums;}
    .back-stat-note{font-family:var(--font-body);font-size:7.5px;color:#6C7075;margin-top:4px;}
    .back-stat-empty .back-stat-note{margin-top:0;text-align:center;}
    .back-wave{margin-bottom:auto;position:relative;z-index:2;}
    .back-wave-label{font-family:var(--font-body);font-weight:500;font-size:7px;letter-spacing:.06em;color:#5B5F64;text-transform:uppercase;display:block;margin-bottom:4px;}
    .back-wave-bars{display:flex;align-items:flex-end;gap:2.5px;height:32px;}
    .back-wave-bars i{flex:1;background:var(--bk-accent,var(--accent));opacity:.55;border-radius:1px;display:block;}
    .back-link{margin-top:9px;font-family:var(--font-body);font-weight:600;font-size:10px;color:var(--bk-accent,var(--accent));text-decoration:none;border:1px solid var(--bk-accent,var(--accent));border-radius:999px;padding:6px 10px;text-align:center;display:block;position:relative;z-index:2;}
    .back-foot{display:flex;justify-content:space-between;font-family:var(--font-body);font-weight:500;font-size:8px;color:#5B5F64;margin-top:6px;position:relative;z-index:2;}

    /* ============ mobile: side-peek cards get too tight below ~640px, so drop
       to a single centered card + nav buttons instead of shrinking forever ============ */
    @media (max-width:640px){
      .slot-side{display:none;}
      .card-persp{width:190px;}
      .card-tilt{height:278px;}
      .carousel-row{min-height:302px;}
      .nav-btn{width:40px;height:40px;font-size:15px;}
      .carousel-wrap{gap:10px;}
      .stage{padding:32px 10px 26px;width:calc(100% - 8vw);margin:0 auto 3rem;}
    }
  </style>
</head>

    var IDLE_POSE = {
      prev:   {transform:"scale(.74) rotate(-7deg)", opacity:".48"},
      center: {transform:"scale(1) rotate(0deg)",     opacity:"1"},
      next:   {transform:"scale(.74) rotate(7deg)",   opacity:".48"}
    };
    // Explicitly animates the .card-idle scale/opacity between two known poses
    // (rather than just re-parenting and hoping the CSS transition catches the
    // change) so the "selected card grows, the other shrinks" swap always plays.
    function animateSwap(persp, fromRole, toRole){
      var idle = persp.querySelector(".card-idle");
      var from = IDLE_POSE[fromRole], to = IDLE_POSE[toRole];
      idle.style.transition = "none";
      idle.style.transform = from.transform;
      idle.style.opacity = from.opacity;
      idle.getBoundingClientRect(); // force reflow so the line above isn't coalesced away
      idle.style.transition = "transform .42s cubic-bezier(.22,1,.36,1), opacity .42s ease";
      idle.style.transform = to.transform;
      idle.style.opacity = to.opacity;
    }

    // ---- position-only "conveyor" sliding, layered on top of animateSwap's
    // scale/opacity swap. A child's transform never affects its own parent's
    // getBoundingClientRect() (CSS transforms don't change layout boxes), so
    // this (translating .card-persp) and animateSwap (scaling .card-idle,
    // one level in) compose without interfering with each other.
    function slotGap(){
      var a = slotCenter.getBoundingClientRect();
      var b = slotNext.getBoundingClientRect();
      var g = b.left - a.left;
      return g > 20 ? g : 170;
    }

    function flipMeasure(persp){
      return persp.getBoundingClientRect();
    }

    // sits at its new screen position). Snap it back to where it used to be
    // with no transition, force the browser to commit that, then release it
    // into an animated transition back to 0 — the slot-to-slot jump reads as
    // one continuous slide.
    function flipPlay(persp, firstRect){
      var last = persp.getBoundingClientRect();
      var dx = firstRect.left - last.left;
      var dy = firstRect.top - last.top;
      if (!dx && !dy) return;
      persp.style.transition = "none";
      persp.style.transform = "translate("+dx+"px,"+dy+"px)";
      persp.getBoundingClientRect(); // force reflow so the jump-back isn't animated
      persp.style.transition = "transform .42s cubic-bezier(.22,1,.36,1)";
      persp.style.transform = "translate(0px,0px)";
    }

    // The exiting card: pull it out of its slot, pin it at that same screen
    // spot as an absolutely-positioned sibling with a low z-index (below both
    // .slot-side and .slot-center), then send it further out in the direction
    // of travel while it shrinks and fades — so the surviving cards sliding
    // across the same ground visually pass in front of it as it goes.
    function sendOff(persp, direction){
      var r = persp.getBoundingClientRect();
      var rowRect = carouselRow.getBoundingClientRect();
      var left = r.left - rowRect.left;
      var top = r.top - rowRect.top;
      persp.remove();
      persp.classList.add("card-fly");
      persp.style.left = left + "px";
      persp.style.top = top + "px";
      persp.style.transition = "none";
      persp.style.transform = "translateX(0px)";
      carouselRow.appendChild(persp);
      persp.getBoundingClientRect(); // force reflow

      var idle = persp.querySelector(".card-idle");
      idle.style.transform = "scale(.5) rotate("+(direction===1?"-11":"11")+"deg)";
      idle.style.opacity = "0";

      persp.style.transition = "transform .44s cubic-bezier(.4,0,1,1)";
      persp.style.transform = "translateX("+(-direction*slotGap()*0.85)+"px)";

      setTimeout(function(){ persp.remove(); }, 470);

    // pose (scale/opacity), so only its position needs to slide in — start it
    // offset further out in the direction of travel (as if still off-frame,
    // occluded), then release it to translateX(0).
    function enterFrom(persp, direction){

      persp.style.transition = "none";
      persp.style.transform = "translateX("+offset+"px)";

      persp.style.transition = "transform .44s cubic-bezier(.22,1,.36,1)";
      persp.style.transform = "translateX(0px)";

      var idle = document.createElement("div");
      idle.className = "card-idle";
      var tilt = document.createElement("div");
      tilt.className = "card-tilt";
      var glare = document.createElement("div");
      glare.className = "glare";
      var inner = document.createElement("div");
      inner.className = "card-inner";
      var aura = document.createElement("div");
      aura.className = "aura";
      aura.style.background = p.darkGlow ? "#fff" : p.grad;
      inner.appendChild(aura); // first = painted behind the edges/faces below
      ["edge-t","edge-r","edge-b","edge-l"].forEach(function(cls){
        var edge = document.createElement("div");
        edge.className = "edge " + cls;
        inner.appendChild(edge);
      });
      inner.appendChild(buildFront(p, idx));
      inner.appendChild(buildBack(p, idx));
      tilt.appendChild(glare);
      tilt.appendChild(inner);
      idle.appendChild(tilt);
      persp.appendChild(idle);

      tilt.tabIndex = 0;
      tilt.setAttribute("role","button");
      tilt.setAttribute("aria-pressed","false");
      tilt.dataset.role = role;
      tilt.dataset.pidx = String(idx);
      tilt.setAttribute("aria-label", roleLabel(role, p, currentLang()));
      setupTilt(tilt, glare);
      return persp;
    }

    function reRole(persp, role, p, idx){
      var tilt = persp.querySelector(".card-tilt");
      var aura = persp.querySelector(".aura");
      tilt.classList.remove("tilting","flipped");
      tilt.style.transform = "";
      if (aura) aura.style.background = p.darkGlow ? "#fff" : p.grad;
      tilt.dataset.role = role;
      tilt.dataset.pidx = String(idx);
      tilt.setAttribute("aria-pressed","false");
      tilt.setAttribute("aria-label", roleLabel(role, p, currentLang()));
    }

    function setupTilt(tilt, glare){
      var down = null;
      var maxDeg = 9;
      var link = tilt.querySelector(".back-link");
      if (link){
        link.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
        link.addEventListener("pointerup", function(e){ e.stopPropagation(); });
      }
      function applyTilt(clientX, clientY){
        var r = tilt.getBoundingClientRect();
        var px = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
        var py = Math.min(1, Math.max(0, (clientY - r.top) / r.height));
        var rx = (py - 0.5) * -2 * maxDeg;
        var ry = (px - 0.5) * 2 * maxDeg;
        tilt.style.transform = "rotateX("+rx.toFixed(2)+"deg) rotateY("+ry.toFixed(2)+"deg)";
        glare.style.setProperty("--gx",(px*100).toFixed(1)+"%");
        glare.style.setProperty("--gy",(py*100).toFixed(1)+"%");
      }
      function reset(){ tilt.classList.remove("tilting"); tilt.style.transform=""; }
      function toggleFlip(){
        var f = tilt.classList.toggle("flipped");
        tilt.setAttribute("aria-pressed", f?"true":"false");
      }
      function activate(){
        if (tilt.dataset.role === "center"){ toggleFlip(); }
        else { go(tilt.dataset.role === "prev" ? -1 : 1); }
      }
      // While gyroscope tilt owns the center card (see the motion-tilt block below),
      // pointer-driven tilt steps aside for it so the two don't fight over the same
      // transform; the card still taps-to-flip normally.
      function gyroOwnsThisCard(){ return gyroActive && tilt.dataset.role === "center"; }
      tilt.addEventListener("pointerenter", function(e){ if (gyroOwnsThisCard()) return; tilt.classList.add("tilting"); applyTilt(e.clientX,e.clientY); });
      tilt.addEventListener("pointermove", function(e){ if (gyroOwnsThisCard()) return; tilt.classList.add("tilting"); applyTilt(e.clientX,e.clientY); });
      tilt.addEventListener("pointerdown", function(e){
        down = {x:e.clientX,y:e.clientY,t:Date.now()};
        try{ tilt.setPointerCapture(e.pointerId); }catch(err){}
        if (gyroOwnsThisCard()) return;
        tilt.classList.add("tilting"); applyTilt(e.clientX,e.clientY);
      });
      tilt.addEventListener("pointerup", function(e){
        try{ tilt.releasePointerCapture(e.pointerId); }catch(err){}
        if (down){
          var dx=e.clientX-down.x, dy=e.clientY-down.y, dt=Date.now()-down.t;
          if (Math.hypot(dx,dy)<10 && dt<500){ activate(); }
        }
        down = null;
        if (e.pointerType==="touch"){ reset(); }
      });
      tilt.addEventListener("pointercancel", function(){ down=null; reset(); });
      tilt.addEventListener("pointerleave", function(e){ if (e.pointerType!=="touch"){ reset(); } });
      tilt.addEventListener("keydown", function(e){
        if (e.key==="Enter"||e.key===" "){ e.preventDefault(); activate(); }
      });
    }

    // ---- Motion (gyroscope/accelerometer) tilt — phones/tablets only ----
    // Replaces press-and-hold as the way to "inspect" the centre card: once
    // enabled, tilting the phone itself drives the card's rotation instead of
    // a finger held on the glass. Falls back to the existing press-and-hold
    // behaviour whenever motion access isn't available or isn't granted.
    var gyroActive = false;
    var gyroBase = null;   // {beta, gamma} captured as the "neutral" pose on enable
    var gyroRAF = null;

    function applyTiltTo(tilt, rx, ry, px, py){
      tilt.classList.add("tilting");
      tilt.style.transform = "rotateX("+rx.toFixed(2)+"deg) rotateY("+ry.toFixed(2)+"deg)";
      var glare = tilt.querySelector(".glare");
      if (glare){
        glare.style.setProperty("--gx",(px*100).toFixed(1)+"%");
        glare.style.setProperty("--gy",(py*100).toFixed(1)+"%");
      }
    }

    function onDeviceOrientation(e){
      if (e.beta == null || e.gamma == null) return;
      if (!gyroBase){ gyroBase = {beta:e.beta, gamma:e.gamma}; return; }
      if (gyroRAF) return;
      gyroRAF = requestAnimationFrame(function(){
        gyroRAF = null;
        var centerTilt = document.querySelector(".slot-center .card-tilt");
        if (!centerTilt || !gyroActive) return;
        var maxDeg = 9, range = 24;
        var db = Math.max(-range, Math.min(range, e.beta - gyroBase.beta));
        var dg = Math.max(-range, Math.min(range, e.gamma - gyroBase.gamma));
        var rx = (db/range) * -maxDeg;
        var ry = (dg/range) * maxDeg;
        var px = Math.min(1, Math.max(0, 0.5 + (dg/range)*0.5));
        var py = Math.min(1, Math.max(0, 0.5 + (db/range)*0.5));
        applyTiltTo(centerTilt, rx, ry, px, py);
      });
    }

    function startGyro(){
      gyroBase = null;
      gyroActive = true;
      window.addEventListener("deviceorientation", onDeviceOrientation);
    }
    function stopGyro(){
      gyroActive = false;
      window.removeEventListener("deviceorientation", onDeviceOrientation);
      var centerTilt = document.querySelector(".slot-center .card-tilt");
      if (centerTilt){ centerTilt.classList.remove("tilting"); centerTilt.style.transform=""; }
    }

    function initGyroToggle(afterEl){
      var isCoarse = window.matchMedia && window.matchMedia("(hover:none) and (pointer:coarse)").matches;
      if (!isCoarse) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "gyro-toggle";
      function label(on){
        btn.innerHTML = spanPair(
          on ? "✦ Motion tilt on — tap to turn off" : "✦ Tilt by moving your phone",
          on ? "✦ 重力感应已开启 — 点击关闭" : "✦ 移动手机来检视卡牌"
        );
      }
      label(false);
      btn.addEventListener("click", function(){
        if (gyroActive){ stopGyro(); btn.classList.remove("on"); label(false); return; }
        var DOE = window.DeviceOrientationEvent;
        if (DOE && typeof DOE.requestPermission === "function"){
          DOE.requestPermission().then(function(state){
            if (state === "granted"){ startGyro(); btn.classList.add("on"); label(true); }
            else {
              btn.innerHTML = spanPair(
                "✦ Motion access denied — check Settings",
                "✦ 未获得权限，请到系统设置里开启"
              );
            }
          }).catch(function(){
            btn.innerHTML = spanPair("✦ Motion tilt unavailable","✦ 当前环境不支持重力感应");
          });
        } else if (DOE){
          startGyro(); btn.classList.add("on"); label(true);
        } else {
          btn.disabled = true;
          btn.innerHTML = spanPair("✦ Motion tilt not supported here","✦ 此设备/浏览器不支持重力感应");
        }
        if (typeof syncAllLanguage === "function") syncAllLanguage();
      });
      afterEl.insertAdjacentElement("afterend", btn);
      if (typeof syncAllLanguage === "function") syncAllLanguage();
    }

    var slotPrev = document.getElementById("slot-prev");
    var slotCenter = document.getElementById("slot-center");
    var slotNext = document.getElementById("slot-next");
    var counter = document.getElementById("counter");
    var carouselRow = document.querySelector(".carousel-row");
    var prevBtn = document.getElementById("prev-btn");
    var nextBtn = document.getElementById("next-btn");
    initGyroToggle(counter);

    function idx(offset){ return (current+offset+n)%n; }

    function relabelNav(lang){
      if (prevBtn) prevBtn.setAttribute("aria-label", lang === "zh" ? "上一张" : "Previous slide");
      if (nextBtn) nextBtn.setAttribute("aria-label", lang === "zh" ? "下一张" : "Next slide");
    }
    function relabelCards(lang){
      document.querySelectorAll(".card-tilt").forEach(function(tilt){
        var p = platforms[+tilt.dataset.pidx];
        if (!p) return;
        tilt.setAttribute("aria-label", roleLabel(tilt.dataset.role, p, lang));
      });
    }
    document.querySelectorAll(".lang-switcher a").forEach(function(link){
      link.addEventListener("click", function(){
        var lang = link.textContent.indexOf("中文") !== -1 ? "zh" : "en";
        relabelNav(lang);
        relabelCards(lang);
      });
    });
    relabelNav(currentLang());

    function updateCounter(){
      var p = platforms[current];
      var nm = platName(p);
      counter.innerHTML = "<b>0"+(current+1)+"</b> / 0"+n+" · "+spanPair(nm.en, nm.zh);
      if (typeof syncAllLanguage === "function") syncAllLanguage();
    }

    // First paint: build all three cards fresh.
    slotPrev.appendChild(buildCard(platforms[idx(-1)], idx(-1), "prev"));
    slotCenter.appendChild(buildCard(platforms[current], current, "center"));
    slotNext.appendChild(buildCard(platforms[idx(1)], idx(1), "next"));
    updateCounter();

    // Later navigation: reuse the two surviving cards (re-parent + re-role them,
    // then explicitly animate their .card-idle scale/opacity between the two
    // known poses, AND their .card-persp screen position via the FLIP helpers
    // above) so both the grow/shrink swap and the actual conveyor-belt slide
    // play together; the dropped card recedes behind the others via sendOff,
    // and the one card newly revealed at the far edge slides in via enterFrom.
    var animating = false;
    function go(direction){
      if (animating || (direction!==1 && direction!==-1)) return;
      animating = true;
      var oldCurrent = current;
      current = idx(direction);

      if (direction === 1){
        var dropped = slotPrev.firstElementChild;
        var toPrev = slotCenter.firstElementChild;   // old center -> new prev
        var toCenter = slotNext.firstElementChild;   // old next -> new center
        var toPrevRect = toPrev ? flipMeasure(toPrev) : null;
        var toCenterRect = toCenter ? flipMeasure(toCenter) : null;

        if (dropped) sendOff(dropped, direction);

        if (toPrev){
          reRole(toPrev, "prev", platforms[oldCurrent], oldCurrent);
          slotPrev.appendChild(toPrev);
          animateSwap(toPrev, "center", "prev");
          flipPlay(toPrev, toPrevRect);
        }
        if (toCenter){
          reRole(toCenter, "center", platforms[current], current);
          slotCenter.appendChild(toCenter);
          animateSwap(toCenter, "next", "center");
          flipPlay(toCenter, toCenterRect);
        }
        var freshIdx = idx(1);
        var fresh = buildCard(platforms[freshIdx], freshIdx, "next");
        slotNext.appendChild(fresh);
        enterFrom(fresh, direction);
      } else {
        var dropped2 = slotNext.firstElementChild;
        var toNext = slotCenter.firstElementChild;   // old center -> new next
        var toCenter2 = slotPrev.firstElementChild;  // old prev -> new center
        var toNextRect = toNext ? flipMeasure(toNext) : null;
        var toCenter2Rect = toCenter2 ? flipMeasure(toCenter2) : null;

        if (dropped2) sendOff(dropped2, direction);

        if (toNext){
          reRole(toNext, "next", platforms[oldCurrent], oldCurrent);
          slotNext.appendChild(toNext);
          animateSwap(toNext, "center", "next");
          flipPlay(toNext, toNextRect);
        }
        if (toCenter2){
          reRole(toCenter2, "center", platforms[current], current);
          slotCenter.appendChild(toCenter2);
          animateSwap(toCenter2, "prev", "center");
          flipPlay(toCenter2, toCenter2Rect);
        }
        var freshIdx2 = idx(-1);
        var fresh2 = buildCard(platforms[freshIdx2], freshIdx2, "prev");
        slotPrev.appendChild(fresh2);
        enterFrom(fresh2, direction);
      }

      updateCounter();
      if (typeof syncAllLanguage === "function") syncAllLanguage();
      setTimeout(function(){ animating = false; }, 470);
    }

    prevBtn.addEventListener("click", function(){ go(-1); });
    nextBtn.addEventListener("click", function(){ go(1); });
    window.addEventListener("keydown", function(e){
      if (e.key === "ArrowLeft"){ go(-1); }
      if (e.key === "ArrowRight"){ go(1); }
    });

    // ---- Live stats overlay ----
    // Runs once after the cards are already on screen with the manually-
    // entered numbers (so the first paint never waits on a network call).
    // Whatever /api/social-stats actually returns (see that file — some
    // platforms come back null until their env vars are set) gets written
    // into `platforms[]` and, for whichever card happens to be mounted
    // right now, patched straight into its back-face DOM.
    function patchStatDOM(p){
      var idx = platforms.indexOf(p);
      document.querySelectorAll(".card-tilt").forEach(function(tilt){
        if (+tilt.dataset.pidx !== idx) return;
        var oldStat = tilt.querySelector(".face.back .back-stat");
        if (oldStat) oldStat.outerHTML = statBlockHTML(p);
      });
    }

    function applyLiveStats(data){
      if (!data) return;
      var byName = {};
      platforms.forEach(function(p){ byName[p.name] = p; });

      if (data.github && byName.GitHub){
        var gh = byName.GitHub;
        gh.stats = [
          {labelEn:"FOLLOWERS", labelZh:"关注者", value: data.github.followers.toLocaleString()},
          {labelEn:"PUBLIC REPOS", labelZh:"公开仓库", value: String(data.github.publicRepos)}
        ];
        gh.live = true;
        patchStatDOM(gh);
      }
      if (data.youtube && byName.YouTube){
        var yt = byName.YouTube;
        yt.stats = [
          {labelEn:"SUBSCRIBERS", labelZh:"订阅者", value: data.youtube.subscribers.toLocaleString()},
          {labelEn:"TOTAL VIEWS", labelZh:"总浏览量", value: data.youtube.views.toLocaleString()}
        ];
        yt.live = true;
        patchStatDOM(yt);
      }
      // Bilibili: the server function fetches a live follower count too, but
      // it isn't wired in here yet — total-view automation for that platform
      // needs an extra (paginated) call this v1 skips. Ask to have it added
      // once the GitHub/YouTube numbers are confirmed working.

      if (typeof syncAllLanguage === "function") syncAllLanguage();
    }

    fetch("/api/social-stats")
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(applyLiveStats)
      .catch(function(){ /* stay on the manually-entered numbers */ });
  })();
  </script>
